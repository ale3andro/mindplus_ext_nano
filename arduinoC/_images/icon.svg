<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="100%" height="100%">
  <defs>
    <!-- Dark Circuit Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050914" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#02050d" />
    </linearGradient>

    <!-- Vibrant Outer Neon Edge Gradient (Pink -> Cyan -> Orange) -->
    <linearGradient id="neonEdgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0080" />
      <stop offset="40%" stop-color="#00f5d4" />
      <stop offset="70%" stop-color="#00bbf9" />
      <stop offset="100%" stop-color="#ff6b00" />
    </linearGradient>

    <!-- Main Text Fill Gradient (3D Metallic Blue/Cyan) -->
    <linearGradient id="textFillGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#d0f4de" />
      <stop offset="55%" stop-color="#00bbf9" />
      <stop offset="85%" stop-color="#005f73" />
      <stop offset="100%" stop-color="#0a192f" />
    </linearGradient>

    <!-- Glowing Circuit Lines Gradient -->
    <linearGradient id="circuitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0080" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#00f5d4" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00bbf9" stop-opacity="0.2" />
    </linearGradient>

    <!-- Microchip Gradient -->
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Intense Neon Glow Filter -->
    <filter id="ultraGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur1" />
      <feGaussianBlur stdDeviation="25" result="blur2" />
      <feGaussianBlur stdDeviation="45" result="blur3" />
      <feMerge>
        <feMergeNode in="blur3" />
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Heavy Drop Shadow Filter -->
    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.95" />
      <feDropShadow dx="0" dy="0" stdDeviation="30" flood-color="#00f5d4" flood-opacity="0.5" />
    </filter>

    <!-- Hexagon Pattern for PCB Texture -->
    <pattern id="hexPattern" width="30" height="52" patternUnits="userSpaceOnUse">
      <path d="M 15 0 L 30 8.66 L 30 25.98 L 15 34.64 L 0 25.98 L 0 8.66 Z" fill="none" stroke="#00f5d4" stroke-width="0.5" stroke-opacity="0.07" />
      <path d="M 15 52 L 30 43.34 L 30 26.02 L 15 17.36 L 0 26.02 L 0 43.34 Z" fill="none" stroke="#00f5d4" stroke-width="0.5" stroke-opacity="0.07" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1000" height="500" fill="url(#bgGrad)" />
  <rect width="1000" height="500" fill="url(#hexPattern)" />

  <!-- Background Circuit Trace Lines -->
  <g stroke="url(#circuitGrad)" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M 20 60 L 220 60 L 300 140 L 450 140" />
    <path d="M 980 440 L 780 440 L 700 360 L 550 360" />
    <path d="M 850 60 L 750 60 L 680 130" />
    <path d="M 150 440 L 250 440 L 320 370" />
  </g>

  <!-- Circuit Solder Nodes -->
  <g fill="#00f5d4" opacity="0.8">
    <circle cx="20" cy="60" r="4" />
    <circle cx="980" cy="440" r="4" />
    <circle cx="850" cy="60" r="4" />
    <circle cx="150" cy="440" r="4" />
  </g>

  <!-- Top Right Microchip Graphic -->
  <g transform="translate(850, 25)" opacity="0.75">
    <rect x="0" y="0" width="90" height="90" rx="10" fill="url(#chipGrad)" stroke="#00f5d4" stroke-width="2" />
    <circle cx="15" cy="15" r="4" fill="#00f5d4" />
    <!-- Chip Legs -->
    <path d="M -12 20 H 0 M -12 45 H 0 M -12 70 H 0" stroke="#00bbf9" stroke-width="3" />
    <path d="M 90 20 H 102 M 90 45 H 102 M 90 70 H 102" stroke="#00bbf9" stroke-width="3" />
    <path d="M 20 -12 V 0 M 45 -12 V 0 M 70 -12 V 0" stroke="#00bbf9" stroke-width="3" />
    <path d="M 20 90 V 102 M 45 90 V 102 M 70 90 V 102" stroke="#00bbf9" stroke-width="3" />
  </g>

  <!-- ================= EXTRA LARGE NANO TEXT LAYERS ================= -->

  <!-- Layer 1: Outermost Heavy Neon Glow -->
  <text x="500" y="375" 
        font-family="system-ui, -apple-system, 'Impact', 'Arial Black', sans-serif"
        font-size="360" 
        font-weight="900" 
        letter-spacing="-4"
        text-anchor="middle" 
        fill="none"
        stroke="url(#neonEdgeGrad)"
        stroke-width="32"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#ultraGlow)"
        opacity="0.95">
    Nano
  </text>

  <!-- Layer 2: High-Contrast Dark Separation Border -->
  <text x="500" y="375" 
        font-family="system-ui, -apple-system, 'Impact', 'Arial Black', sans-serif"
        font-size="360" 
        font-weight="900" 
        letter-spacing="-4"
        text-anchor="middle" 
        fill="none"
        stroke="#050914"
        stroke-width="18"
        stroke-linecap="round"
        stroke-linejoin="round">
    Nano
  </text>

  <!-- Layer 3: Main Foreground Fill with 3D Gradient & Shadow -->
  <text x="500" y="375" 
        font-family="system-ui, -apple-system, 'Impact', 'Arial Black', sans-serif"
        font-size="360" 
        font-weight="900" 
        letter-spacing="-4"
        text-anchor="middle" 
        fill="url(#textFillGrad)"
        filter="url(#textShadow)">
    Nano
  </text>

  <!-- Layer 4: Inner Crisp Highlight Edge -->
  <text x="500" y="375" 
        font-family="system-ui, -apple-system, 'Impact', 'Arial Black', sans-serif"
        font-size="360" 
        font-weight="900" 
        letter-spacing="-4"
        text-anchor="middle" 
        fill="none"
        stroke="#ffffff"
        stroke-width="3"
        stroke-opacity="0.6"
        stroke-linecap="round"
        stroke-linejoin="round">
    Nano
  </text>
</svg>